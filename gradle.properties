#Gradle
org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx6g" -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.unsafe.configuration-cache=true
org.gradle.configuration-cache=true



#Kotlin
kotlin.code.style=official
# Enable the new native memory model. Is default in >1.7.10
kotlin.native.binary.memoryModel=experimental

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false
# KSP 2 (the Analysis API implementation) fails with "unexpected jvm signature V" on the Room
# compiler in this project, so keep using the KSP 1 implementation.
ksp.useKSP2=false
