#Gradle
org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx6g" -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.unsafe.configuration-cache=true
org.gradle.configuration-cache=true



#Kotlin
kotlin.code.style=official
# Enable the new native memory model. Is default in >1.7.10
kotlin.native.binary.memoryModel=experimental

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# AGP 9 defaults this to true, which creates unit test components only for the tested build type
# (debug). This project runs both its unit tests and its E2E tests on the release variant and
# disables debug variants in CI, so with the default no test task exists at all and the build goes
# green having run nothing.
android.onlyEnableUnitTestForTheTestedBuildType=false
