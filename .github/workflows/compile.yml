name: Compile

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set local.properties
        run: echo \"sdk.dir=/usr/lib/android-sdk\" \> local.properties

      - name: Gradle Wrapper Verification
        uses: gradle/actions/wrapper-validation@v5

      - name: JDK setup
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25.0.4+101.0.LTS

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action installs "tools platform-tools" by default, and Google has withdrawn the
          # obsolete "tools" package, so the default makes sdkmanager exit 1 before anything builds.
          packages: 'platform-tools'

      - name: Compile sources
        run: ./gradlew compileProductionUnrestrictedReleaseSources

      - name: Compile test sources
        run: ./gradlew compileProductionUnrestrictedReleaseUnitTestSources
