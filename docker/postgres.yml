# ----------------------------------------------------------------------------------------------------------------------
# PostgreSQL base service
# ----------------------------------------------------------------------------------------------------------------------

services:
  postgres:
    # The self-hosted runners also run other Artemis setups, so the container and its volume get names of their own,
    # and the database port is not published on the host
    container_name: artemis-postgres-android
    image: docker.io/library/postgres:18.6-alpine
    user: postgres
    command: ["postgres", "-c", "max_connections=10000"]
    volumes:
      - artemis-postgres-data-android:/var/lib/postgresql
    # DO NOT use this default configuration for production systems!
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: Artemis
      POSTGRES_DB: Artemis
      PGDATA: /var/lib/postgresql/pgdata
    # expose the port to make it reachable docker internally
    expose:
      - "5432"
    healthcheck:
      test: pg_isready -U Artemis -d Artemis
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 300s
    shm_size: '256m'
    networks:
      - artemis

networks:
  artemis:
    driver: "bridge"
    name: artemis

volumes:
  artemis-postgres-data-android:
    name: artemis-postgres-data-android
